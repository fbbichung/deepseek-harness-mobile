name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js & Managers
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-detect and build harness overlay
        run: |
          set +e
          corepack enable
          echo "=== 1. Check repo structure ==="
          ls -la
          ls -la dsh-mobile/
          ls -la dsh-mobile/app/src/main/ || true

          echo "=== 2. Install workspace dependencies ==="
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --no-frozen-lockfile
            pnpm -r build
          elif [ -f "yarn.lock" ]; then
            yarn install
            yarn build
          else
            npm install --workspaces --if-present || npm install --legacy-peer-deps
            npm run build --workspaces --if-present || npm run build
          fi

          echo "=== 3. Run mobile asset sync scripts ==="
          for s in $(find . -maxdepth 3 \( -name "*overlay*" -o -name "*sync*" -o -name "*bundle*" -o -name "*mobile*" \) -type f); do
            case "$s" in
              *.sh) echo "Running $s"; bash "$s" ;;
              *.mjs|*.js) echo "Running $s"; node "$s" ;;
              *.py) echo "Running $s"; python3 "$s" ;;
            esac
          done
          exit 0

      - name: Build Debug APK
        working-directory: dsh-mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk-full
          path: dsh-mobile/app/build/outputs/apk/debug/*.apk
