name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build local harness bundle & sync assets
        run: |
          npm install
          npm run build || true
          if [ -f "scripts/sync-mobile.sh" ]; then bash scripts/sync-mobile.sh; fi
          if [ -f "package.json" ] && grep -q "mobile" package.json; then npm run build:mobile || true; fi

      - name: Build Debug APK
        working-directory: dsh-mobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk-full
          path: dsh-mobile/app/build/outputs/apk/debug/*.apk
