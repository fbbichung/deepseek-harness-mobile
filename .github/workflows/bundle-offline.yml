name: Bundle Offline Runtime

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and Install Dependencies (ARM64 compatible)
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile --config.supportedArchitectures.cpu=arm64 --config.supportedArchitectures.cpu=x64

      - name: Build CLI and Dependencies
        run: |
          pnpm --config.ignore-workspace-cycles=true --filter @deepseek-ai/dsh... build || pnpm build || true

      - name: Package Full Offline Bundle
        run: |
          tar -czf dsh-offline-bundle.tar.gz \
            --exclude='.git' \
            --exclude='android' \
            --exclude='ios' \
            --exclude='dsh-offline-bundle.tar.gz' \
            .

      - name: Upload Offline Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-offline-bundle
          path: dsh-offline-bundle.tar.gz
