name: Bundle Offline Runtime

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and Install Dependencies
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Build CLI and Dependencies
        run: |
          pnpm --filter @deepseek-ai/dsh... build

      - name: Package Full Offline Bundle
        run: |
          tar -czf dsh-offline-bundle.tar.gz \
            --exclude='.git' \
            --exclude='android' \
            --exclude='ios' \
            .

      - name: Upload Offline Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-offline-bundle
          path: dsh-offline-bundle.tar.gz
